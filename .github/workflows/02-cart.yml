name: КТ 2 — Корзина
on:
  push:
    paths: ['02-cart/**', '.github/workflows/02-cart.yml']
  pull_request:
    paths: ['02-cart/**', '.github/workflows/02-cart.yml']
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 02-cart
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test

